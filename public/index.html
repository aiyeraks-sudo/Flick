<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flick</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:14px">
    <button class="back-btn" id="globalBack" onclick="goBack()" style="display:none">← Back</button>
    <h1 onclick="goHome()" style="cursor:pointer">Flick</h1>
    <span style="font-size:0.85rem;opacity:0.6">Bet on yourself.</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <button id="walletBtn" class="wallet-btn" onclick="openWallet()" style="display:none">💰 $0.00</button>
    <!-- Profile (signed in) -->
    <div id="profileChip" class="profile-chip" style="display:none" onclick="openProfile()">
      <div class="profile-avatar" id="profileAvatar"></div>
      <span id="profileName"></span>
    </div>
    <!-- Sign in (not signed in) -->
    <button id="signInBtn" class="sign-in-btn" onclick="openSignIn()">Sign In</button>
  </div>
</header>

<!-- Sign-in screen (full page gate) -->
<div id="signin-screen">
  <div class="signin-card">
    <h1 class="signin-logo">Flick</h1>
    <p class="signin-tagline">Bet on yourself.</p>
    <div class="form-group">
      <label>Your name</label>
      <input type="text" id="profileNameInput" placeholder="e.g. Michael Manning" autocomplete="name">
    </div>
    <div class="form-group">
      <label>Email <span style="font-weight:400;color:#888">(optional)</span></label>
      <input type="email" id="profileEmailInput" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Phone <span style="font-weight:400;color:#888">(optional — for iMessage notifications)</span></label>
      <input type="tel" id="profilePhoneInput" placeholder="+1 555 000 0000" autocomplete="tel">
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="createProfile()">Let's go →</button>
  </div>
</div>

<!-- Profile Modal -->
<div id="profileModal" class="modal-overlay" onclick="closeProfileOnOverlay(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Your Profile</h2>
      <button class="modal-close" onclick="closeProfile()">✕</button>
    </div>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
      <div class="profile-avatar profile-avatar-lg" id="profileAvatarLg"></div>
      <div>
        <div style="font-size:1.2rem;font-weight:700" id="profileModalName"></div>
        <div style="font-size:0.82rem;color:#aaa" id="profileModalEmail"></div>
      </div>
    </div>
    <button class="btn btn-secondary" style="width:100%" onclick="signOut()">Sign Out</button>
  </div>
</div>

<!-- Wallet Modal -->
<div id="walletModal" class="modal-overlay" onclick="closeWalletOnOverlay(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Wallet</h2>
      <button class="modal-close" onclick="closeWallet()">✕</button>
    </div>
    <div class="wallet-balance-display">
      <div class="wallet-balance-label">Available Balance</div>
      <div class="wallet-balance-amount" id="modalBalance">$0.00</div>
    </div>

    <div class="wallet-section">
      <div class="section-title">Top Up</div>
      <div class="wallet-amounts">
        <button class="amount-chip" onclick="setTopUpAmount(10)">$10</button>
        <button class="amount-chip" onclick="setTopUpAmount(25)">$25</button>
        <button class="amount-chip" onclick="setTopUpAmount(50)">$50</button>
        <button class="amount-chip" onclick="setTopUpAmount(100)">$100</button>
      </div>
      <div class="wallet-input-row">
        <input type="number" id="topUpAmount" placeholder="Custom amount" min="1">
        <button class="btn btn-primary" onclick="doTopUp()">Add Funds</button>
      </div>
    </div>

    <div class="wallet-section">
      <div class="section-title">Withdraw to Bank</div>
      <div class="form-group" style="margin-bottom:10px">
        <input type="number" id="withdrawAmount" placeholder="Amount to withdraw" min="1" style="border:1px solid #ddd;border-radius:6px;padding:10px 12px;font-size:0.95rem;width:100%">
      </div>
      <div class="form-group" style="margin-bottom:10px">
        <input type="text" id="bankRouting" placeholder="Routing number" style="border:1px solid #ddd;border-radius:6px;padding:10px 12px;font-size:0.95rem;width:100%">
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <input type="text" id="bankAccount" placeholder="Account number" style="border:1px solid #ddd;border-radius:6px;padding:10px 12px;font-size:0.95rem;width:100%">
      </div>
      <button class="btn btn-secondary" style="width:100%" onclick="doWithdraw()">Withdraw</button>
    </div>
  </div>
</div>

<main id="app-main" style="display:none">
  <!-- Home: list challenges -->
  <div id="view-home" class="view active">
    <div class="view-header">
      <h2>Challenges</h2>
      <button class="btn btn-primary" onclick="showView('view-create')">+ New Challenge</button>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">Active</button>
      <button class="tab-btn" id="tab-history" onclick="switchTab('history')">History</button>
      <button class="tab-btn" id="tab-friends" onclick="switchTab('friends')">Friends</button>
      <button class="tab-btn" id="tab-feed" onclick="switchTab('feed')">Feed</button>
    </div>

    <!-- Active tab -->
    <div id="tab-content-active">
      <div class="home-section-label">Sent by You</div>
      <div id="list-sent"></div>
      <div class="home-section-label" style="margin-top:24px">Open Challenges</div>
      <div id="list-open"></div>
    </div>

    <!-- History tab -->
    <div id="tab-content-history" style="display:none">
      <div id="list-history"></div>
    </div>

    <!-- Feed tab -->
    <div id="tab-content-feed" style="display:none">
      <div id="list-feed"></div>
    </div>

    <!-- Friends tab -->
    <div id="tab-content-friends" style="display:none">
      <div class="add-friend-bar">
        <input type="email" id="addFriendEmail" placeholder="Email address">
        <input type="tel" id="addFriendPhone" placeholder="Phone (iMessage)">
        <button class="btn btn-primary" onclick="addFriend()">+ Invite</button>
      </div>
      <div id="list-friends"></div>
    </div>
  </div>

  <!-- Quick Challenge Modal -->
  <div id="quickChallengeModal" class="modal-overlay" onclick="closeQuickChallengeOnOverlay(event)">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Challenge <span id="qc-friend-name"></span></h2>
        <button class="modal-close" onclick="closeQuickChallenge()">✕</button>
      </div>
      <div class="form-group">
        <label>Challenge name</label>
        <input type="text" id="qc-name" placeholder="e.g. Hit the gym by 9am">
      </div>
      <div class="form-group">
        <label>Deadline</label>
        <input type="datetime-local" id="qc-deadline">
      </div>
      <div class="form-group">
        <label>Stake per person ($)</label>
        <input type="number" id="qc-stake" placeholder="20" min="1">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="sendQuickChallenge()">Push Challenge →</button>
    </div>
  </div>

  <!-- Create challenge -->
  <div id="view-create" class="view">
    <div class="form-card">
      <h2 style="margin-bottom:20px">New Challenge</h2>
      <div class="form-group">
        <label>Challenge name</label>
        <input type="text" id="c-name" placeholder="e.g. Hit the gym by 9am">
      </div>
      <div class="form-group">
        <label>Description <span style="font-weight:400;color:#888">(what should the photo show?)</span></label>
        <textarea id="c-desc" placeholder="e.g. Photo at the gym entrance, photo of your notes — proof is always a photo."></textarea>
      </div>
      <div class="form-group">
        <label>Deadline</label>
        <input type="datetime-local" id="c-deadline">
      </div>
      <div class="form-group">
        <label>Stake per person ($)</label>
        <input type="number" id="c-stake" placeholder="20" min="1">
      </div>
      <div class="form-group">
        <label>Invite friends by email <span style="font-weight:400;color:#888">(comma-separated)</span></label>
        <input type="text" id="c-emails" placeholder="alice@gmail.com, bob@gmail.com">
        <div style="font-size:0.78rem;color:#aaa;margin-top:4px">They'll get an email to accept or decline.</div>
      </div>
      <button class="btn btn-primary" onclick="createChallenge()">Create & Send Invites</button>
    </div>
  </div>

  <!-- Challenge detail -->
  <div id="view-detail" class="view">
    <div id="detail-content"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
